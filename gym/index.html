<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="V-Taper">
<meta name="theme-color" content="#0f1115">
<title>V-Taper Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--bg:#0f1115;--card:#181b22;--card2:#252a34;--fg:#eef0f4;--mut:#8b93a3;--acc:#ff7a3d;--ok:#3ecf8e;--bad:#ff5d6c;--line:#2a2f3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:0 14px}
nav{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:6px;padding:10px 14px;max-width:520px;margin:0 auto}
nav button{flex:1;padding:10px 0;border-radius:12px;border:0;background:var(--card);color:var(--mut);font-weight:600;font-size:13px}
nav button.on{background:var(--acc);color:#111}
.card{background:var(--card);border-radius:16px;padding:14px;margin:10px 0}
h1{font-size:22px;margin:4px 0} h2{font-size:17px;margin:0 0 4px}
.mut{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--acc);color:#111;font-weight:700;font-size:17px;margin:10px 0 0}
.btn.sec{background:var(--card2);color:var(--fg)}
.btn.small{display:inline-block;width:auto;padding:9px 13px;font-size:14px;margin:6px 6px 0 0}
.row{display:flex;align-items:center;gap:8px}
.ex{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.ex .nm{flex:1}
.x{background:none;border:0;color:var(--mut);font-size:20px;padding:4px 8px}
.set{display:grid;grid-template-columns:22px 1fr 1fr 50px;gap:6px;align-items:center;margin:6px 0}
.step{display:flex;align-items:center;background:var(--card2);border-radius:12px;overflow:hidden}
.step button{width:40px;height:46px;border:0;background:none;color:var(--fg);font-size:22px;flex:none}
.step input{flex:1;min-width:0;width:100%;height:46px;border:0;background:none;color:var(--fg);text-align:center;font-size:18px;font-weight:700}
.chk{height:46px;border-radius:12px;border:2px solid var(--line);background:none;color:var(--mut);font-size:20px}
.chk.on{background:var(--ok);border-color:var(--ok);color:#111}
.set.done .step{opacity:.6}
.hint{font-size:13px;color:var(--acc);margin-top:2px}
.lbl{font-size:11px;color:var(--mut);text-align:center}
#timer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:#1d2129f2;border-top:1px solid var(--line);display:none;z-index:9}
#timer .in{max-width:520px;margin:0 auto;display:flex;align-items:center;gap:8px}
#timer .t{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;min-width:78px}
#timer .bar{height:5px;background:var(--acc);border-radius:3px;transition:width .25s linear}
#timer .btn.small{margin:0}
.dots span{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--card2);margin-right:6px}
.dots span.on{background:var(--ok)}
.stat{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.up{color:var(--ok)} .down{color:var(--bad)}
select,input.plain{background:var(--card2);color:var(--fg);border:0;border-radius:10px;padding:11px;font-size:16px;width:100%;margin-top:10px;-webkit-appearance:none;appearance:none}
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal .card{max-width:420px;width:100%}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;display:none;z-index:30;box-shadow:0 4px 20px #0008}
details summary{list-style:none} details summary::-webkit-details-marker{display:none}
</style></head><body>
<nav id="nav"></nav><main id="app"></main>
<div id="timer"><div class="in"><div class="t" id="tt">0:00</div><div style="flex:1"><div class="mut">Rest</div><div style="background:var(--card2);border-radius:3px"><div class="bar" id="tb"></div></div></div><button class="btn small sec" data-act="rest" data-d="-15">−15</button><button class="btn small sec" data-act="rest" data-d="15">+15</button><button class="btn small" data-act="rest" data-d="0">Skip</button></div></div>
<div id="toast"></div>
<script>
'use strict';
const KEY='vtaper_log_v1',DAY=864e5;
// Seeded from the "12 Weeks, 24 workouts" note (start → current best, n sessions)
const EX=[
 {id:'row',e:'❤️‍🔥',name:'Row warm-up',kind:'cardio',group:'warmup',unit:'m',pin:1,tSets:1,tReps:0,step:10,start:[1160],best:[1230],n:8},
 {id:'pulldown',e:'🔙',name:'Lat Pulldown',kind:'lift',group:'vpull',tSets:4,tReps:12,step:2.5,start:[40,10],best:[61,11],n:7,note:'Wide pronated grip · 4×12 clean before +2–3 kg'},
 {id:'pullup',e:'🔙',name:'Assisted Pull-Up',kind:'assist',group:'vpull',tSets:4,tReps:10,step:2,start:[12,12],best:[9,9],n:6,note:'Assistance kg (less = harder) · wide/neutral grip · 4×10 before −2 kg'},
 {id:'chest',e:'🏋️',name:'Chest Press (4s)',kind:'lift',group:'chest',tSets:4,tReps:10,step:2.5,start:[70,12],best:[63,10],n:8,note:'4 s lowering'},
 {id:'dbbench',e:'🏋️',name:'DB Bench Press',kind:'lift',group:'chest',tSets:3,tReps:12,step:2,start:[16,12],best:[38,12],n:5},
 {id:'pullover',e:'🔙',name:'Pullover',kind:'lift',group:'back',tSets:3,tReps:12,step:2.5,start:[27,12],best:[27,12],n:6},
 {id:'srow',e:'🔙',name:'Seated Row',kind:'lift',group:'back',tSets:3,tReps:10,step:2.5,start:[24,9],best:[30,10],n:5,off:1,note:'Cut in V-taper notes'},
 {id:'shoulder',e:'🙆',name:'Shoulder Press',kind:'lift',group:'shoulder',tSets:2,tReps:10,step:2,start:[28,9],best:[31,10],n:6,note:'2 sets, do it last'},
 {id:'latraise',e:'🙆',name:'Seated Lat Raise',kind:'lift',group:'shoulder',pin:1,tSets:3,tReps:12,step:1,start:[5,12],best:[12,10],n:6,note:'+ light burnout 2×15–20'},
 {id:'facepull',e:'🎯',name:'Face Pull / Rear-Delt Fly',kind:'lift',group:'shoulder',tSets:2,tReps:15,step:1,start:null,best:null,n:0,note:'New · 2×15'},
 {id:'curl',e:'💪',name:'Curls 3s (kg/arm)',kind:'lift',group:'arms',tSets:2,tReps:12,step:1,start:[24,6],best:[16,11],n:10,note:'2 sets'},
 {id:'hammer',e:'💪',name:'Hammer Curl (kg/arm)',kind:'lift',group:'arms',tSets:2,tReps:12,step:1,start:null,best:null,n:0,note:'2 sets'},
 {id:'triceps',e:'💪',name:'Triceps Pushdown',kind:'lift',group:'arms',tSets:3,tReps:12,step:2.5,start:[20,10],best:[27,12],n:9}
];
const defaults=()=>({v:1,settings:{startDate:'2026-09-11',prior:10,rest:90,per:6,weeks:24,perWeek:2},ex:EX.map(e=>({...e,active:!e.off})),sessions:[],cur:null,plan:null});
let S=load(),tab=S.cur?'work':'plan',restEnd=0,restDur=1,actx=null;
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.ex&&s.sessions)return s}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('⚠️ Saving failed — export a backup')}}
const X=id=>S.ex.find(e=>e.id===id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const r1=n=>Math.round(n*10)/10;
const p2=n=>String(n).padStart(2,'0');
const dfmt=d=>{d=new Date(d);return p2(d.getDate())+'.'+p2(d.getMonth()+1)+'.'+String(d.getFullYear()).slice(2)};
const arrSet=a=>a?{w:a[0],r:a[1]||0}:null;

// ---------- history & metrics ----------
function hist(id){const o=[];S.sessions.forEach((s,i)=>{const it=s.items.find(x=>x.ex===id);if(it&&it.sets.length)o.push({i,date:s.date,sets:it.sets})});return o}
const count=e=>(e.n||0)+hist(e.id).length;
function since(e){for(let k=S.sessions.length-1;k>=0;k--)if(S.sessions[k].items.some(x=>x.ex===e.id))return S.sessions.length-1-k;return 2}
function metric(e,s){if(!s)return null;if(e.kind==='cardio')return +s.w;if(e.kind==='assist')return -s.w+s.r/100;return s.w*(1+s.r/30)} // Epley e1RM
function bestMetric(e){let b=e.best?metric(e,arrSet(e.best)):null;for(const h of hist(e.id))for(const s of h.sets){const m=metric(e,s);if(b==null||m>b)b=m}return b}
function bestSet(e){let bs=arrSet(e.best),b=bs?metric(e,bs):null;for(const h of hist(e.id))for(const s of h.sets){const m=metric(e,s);if(b==null||m>b){b=m;bs=s}}return bs}
const fs=(e,s)=>!s?'—':e.kind==='cardio'?`${s.w} ${e.unit||''}`:e.kind==='assist'?`−${s.w}×${s.r}`:`${s.w}×${s.r}`;
function lastSets(e){const h=hist(e.id);return h.length?h[h.length-1].sets:null}
const volume=s=>s.items.reduce((a,it)=>{const e=X(it.ex);return a+(e&&e.kind==='lift'?it.sets.reduce((b,x)=>b+x.w*x.r,0):0)},0);

function advice(e){
 const last=lastSets(e),as=e.kind==='assist';
 if(e.kind==='cardio'){const b=bestSet(e);return{text:b?`Beat ${b.w} ${e.unit}`:'',ready:false}}
 if(!last){const b=arrSet(e.best);return{text:b?`Goal ${e.tSets}×${e.tReps} @ ${as?'−':''}${b.w} kg`:`Find a weight for ${e.tSets}×${e.tReps}`,ready:false,w:b?b.w:null}}
 const top=as?Math.min(...last.map(s=>s.w)):Math.max(...last.map(s=>s.w));
 const met=last.length>=e.tSets&&last.slice(0,e.tSets).every(s=>s.r>=e.tReps);
 if(met){const nw=as?Math.max(0,r1(top-e.step)):r1(top+e.step);return{text:`✅ Hit ${e.tSets}×${e.tReps} — go ${as?'−'+nw+' kg assist':nw+' kg'}`,ready:true,w:nw}}
 return{text:`Goal ${e.tSets}×${e.tReps} @ ${as?'−':''}${top} kg`,ready:false,w:top}}

function prefill(e){
 const a=advice(e),last=lastSets(e);
 if(e.kind==='cardio'){const b=last?last[0]:arrSet(e.best);return[{w:b?b.w:0,r:0,done:false}]}
 const o=[];
 for(let j=0;j<Math.max(1,e.tSets);j++){const l=last?(last[j]||last[last.length-1]):arrSet(e.best);
  o.push({w:a.ready?a.w:(l?l.w:(a.w||0)),r:a.ready?e.tReps:(l?l.r:e.tReps),done:false})}
 return o}

// ---------- suggestion ----------
const ORD={warmup:0,vpull:1,chest:2,back:3,shoulder:4,arms:5};
const sortPlan=ids=>ids.sort((a,b)=>ORD[X(a).group]-ORD[X(b).group]);
function buildPlan(){
 const act=S.ex.filter(e=>e.active),maxN=Math.max(0,...act.map(count));
 const sc=e=>since(e)*3+(maxN-count(e)),by=(a,b)=>sc(b)-sc(a);
 const ch=[],gc={},add=e=>{ch.push(e.id);gc[e.group]=(gc[e.group]||0)+1};
 act.filter(e=>e.group==='warmup').forEach(add);
 const vp=act.filter(e=>e.group==='vpull').sort(by)[0];if(vp)add(vp);     // vertical pull first, always
 act.filter(e=>e.pin&&!ch.includes(e.id)).forEach(add);
 const caps={vpull:1,chest:1,back:1,shoulder:2,arms:2},lifts=()=>ch.filter(id=>X(id).group!=='warmup').length;
 const rest=act.filter(e=>!ch.includes(e.id)).sort(by);
 for(const e of rest){if(lifts()>=S.settings.per)break;if((gc[e.group]||0)<(caps[e.group]??2))add(e)}
 for(const e of rest){if(lifts()>=S.settings.per)break;if(!ch.includes(e.id))add(e)}
 return sortPlan(ch)}
function why(e){const h=hist(e.id).length,s=since(e);if(e.pin&&e.group==='warmup')return'Warm-up';
 const base=!h?'not logged in app yet':s===0?'done last session':`last done ${s} session${s>1?'s':''} ago`;return`${base} · ${count(e)} total${e.pin?' · 📌':''}`}

// ---------- progress ----------
function prog(){const st=S.settings,goal=st.weeks*st.perWeek,done=(+st.prior||0)+S.sessions.length;
 const start=new Date(st.startDate+'T00:00');const wk=Math.max(1,Math.min(st.weeks,Math.floor((Date.now()-start)/(7*DAY))+1));return{goal,done,wk}}
function weekStart(d){d=new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()-(d.getDay()+6)%7);return d.getTime()}
const inWeek=t=>S.sessions.filter(s=>weekStart(s.date)===t).length;
const thisWeek=()=>inWeek(weekStart(Date.now()));
function streak(){const pw=S.settings.perWeek;let w=weekStart(Date.now()),n=0;if(inWeek(w)>=pw)n++;w=weekStart(w-1);while(inWeek(w)>=pw){n++;w=weekStart(w-1)}return n}
function ring(p,label,sub){const R=50,C=2*Math.PI*R,o=C*(1-Math.min(1,Math.max(0,p)));
 return`<svg viewBox="0 0 120 120" width="112" height="112" style="flex:none"><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--card2)" stroke-width="11"/><circle cx="60" cy="60" r="${R}" fill="none" stroke="var(--acc)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${o}" transform="rotate(-90 60 60)"/><text x="60" y="60" text-anchor="middle" fill="var(--fg)" font-size="22" font-weight="800">${label}</text><text x="60" y="80" text-anchor="middle" fill="var(--mut)" font-size="11">workouts</text></svg>`}
const LINES=['Show up, log it, leave. That’s the whole trick.','Lats first. Ego last.','Small jumps, every week.','Width is built one clean rep at a time.','Two a week beats seven once.'];
function header(){const p=prog(),tw=thisWeek(),pw=S.settings.perWeek;
 return`<div class="card row" style="gap:14px">${ring(p.done/p.goal,p.done+'/'+p.goal)}<div style="flex:1"><h2>Week ${p.wk} of ${S.settings.weeks}</h2><div class="dots">${Array.from({length:pw},(_,i)=>`<span class="${i<tw?'on':''}"></span>`).join('')}</div><div class="mut" style="margin-top:6px">${tw>=pw?'Week target hit 💥':`${pw-tw} to go this week`} · streak ${streak()} wk</div><div class="mut">${Math.round(p.done/p.goal*100)}% of the block</div></div></div>`}

// ---------- views ----------
function nav(){const t=[['plan','Next'],['work','Workout'],['stats','Progress'],['hist','History'],['set','⚙︎']];
 document.getElementById('nav').innerHTML=t.map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}${k==='work'&&S.cur?' ●':''}</button>`).join('')}
function render(){nav();document.getElementById('app').innerHTML={plan:rPlan,work:rWork,stats:rStats,hist:rHist,set:rSet}[tab]()}
function addSelect(act,excl){const o=S.ex.filter(e=>!excl.includes(e.id)).map(e=>`<option value="${e.id}">${e.e} ${esc(e.name)}${e.active?'':' (off)'}</option>`).join('');return o?`<select data-act="${act}"><option value="">+ Add exercise…</option>${o}</select>`:''}

function rPlan(){
 if(S.cur)return header()+`<div class="card"><h2>Workout in progress</h2><button class="btn" data-tab="work">Resume</button></div>`;
 if(!S.plan||!S.plan.every(X)){S.plan=buildPlan();save()}
 const p=prog();
 return header()+`<div class="card"><h2>Next up: workout #${p.done+1}</h2><div class="mut">${LINES[p.done%LINES.length]}</div>
 ${S.plan.map(id=>{const e=X(id);return`<div class="ex"><div style="font-size:22px">${e.e}</div><div class="nm"><div>${esc(e.name)}</div><div class="mut">${why(e)}</div><div class="hint">${esc(advice(e).text)}</div></div><button class="x" data-act="plrm" data-id="${id}">✕</button></div>`}).join('')}
 ${addSelect('pladd',S.plan)}
 <button class="btn" data-act="start">Start workout</button><button class="btn sec" data-act="regen">Re-suggest</button></div>`}

function stepper(i,j,f,v){return`<div class="step"><button data-act="inc" data-i="${i}" data-j="${j}" data-f="${f}" data-d="-1">−</button><input type="text" inputmode="decimal" value="${v}" data-i="${i}" data-j="${j}" data-f="${f}"><button data-act="inc" data-i="${i}" data-j="${j}" data-f="${f}" data-d="1">+</button></div>`}
function rWork(){
 if(!S.cur)return`<div class="card"><h2>No workout running</h2><button class="btn" data-tab="plan">See next workout</button></div>`;
 const c=S.cur,min=Math.floor((Date.now()-c.started)/60000),ticked=c.items.reduce((a,it)=>a+it.sets.filter(s=>s.done).length,0),total=c.items.reduce((a,it)=>a+it.sets.length,0);
 return`<div class="card"><div class="row"><div style="flex:1"><h2>${ticked}/${total} sets</h2><div class="mut">${min} min in</div></div></div><div style="background:var(--card2);border-radius:3px;margin-top:8px"><div style="height:6px;border-radius:3px;background:var(--ok);width:${total?ticked/total*100:0}%"></div></div></div>`+
 c.items.map((it,i)=>{const e=X(it.ex),last=lastSets(e),cd=e.kind==='cardio';
 return`<div class="card"><div class="row" style="align-items:flex-start"><div style="flex:1"><h2>${e.e} ${esc(e.name)}</h2><div class="mut">Last: ${last?last.map(s=>fs(e,s)).join(', '):e.best?'best '+fs(e,arrSet(e.best)):'—'}</div>${e.note?`<div class="mut">${esc(e.note)}</div>`:''}<div class="hint">${esc(advice(e).text)}</div></div><button class="x" data-act="wrm" data-i="${i}">✕</button></div>
 <div class="set" style="margin:10px 0 0"><div></div><div class="lbl">${cd?e.unit:e.kind==='assist'?'assist kg':'kg'}</div><div class="lbl">${cd?'':'reps'}</div><div></div></div>
 ${it.sets.map((s,j)=>`<div class="set ${s.done?'done':''}"><div class="mut">${j+1}</div>${stepper(i,j,'w',s.w)}${cd?'<div></div>':stepper(i,j,'r',s.r)}<button class="chk ${s.done?'on':''}" data-act="done" data-i="${i}" data-j="${j}">✓</button></div>`).join('')}
 ${cd?'':`<button class="btn small sec" data-act="addset" data-i="${i}">+ set</button><button class="btn small sec" data-act="rmset" data-i="${i}">− set</button>`}</div>`}).join('')+
 `<div class="card">${addSelect('wadd',c.items.map(x=>x.ex))}<button class="btn" data-act="finish">Finish workout</button><button class="btn sec" data-act="cancel">Discard</button></div>`}

function spark(a){a=a.filter(v=>v!=null&&isFinite(v));if(a.length<2)return'';const W=84,H=26,mn=Math.min(...a),mx=Math.max(...a),sp=mx-mn||1;
 const pts=a.map((v,i)=>`${(i/(a.length-1)*W).toFixed(1)},${(H-3-(v-mn)/sp*(H-6)).toFixed(1)}`).join(' ');
 return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><polyline points="${pts}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function weekChart(){if(!S.sessions.length)return'<div class="mut">Log a workout to see this.</div>';
 const wks=[];let w=weekStart(Date.now());for(let k=0;k<8;k++){wks.unshift(w);w=weekStart(w-1)}
 const v=wks.map(t=>S.sessions.filter(s=>weekStart(s.date)===t).reduce((a,s)=>a+volume(s),0)),mx=Math.max(1,...v),W=320,H=100,bw=W/8;
 return`<svg viewBox="0 0 ${W} ${H+18}" width="100%">${v.map((x,i)=>{const h=Math.max(x?3:0,x/mx*H);return`<rect x="${i*bw+6}" y="${H-h}" width="${bw-12}" height="${h}" rx="4" fill="${i===7?'var(--acc)':'#4a5262'}"/><text x="${i*bw+bw/2}" y="${H+14}" text-anchor="middle" font-size="10" fill="var(--mut)">${dfmt(wks[i]).slice(0,5)}</text>`}).join('')}</svg>`}
function rStats(){
 const rows=S.ex.filter(e=>e.active||hist(e.id).length).map(e=>{
  const ser=[];if(e.start)ser.push(metric(e,arrSet(e.start)));if(e.best)ser.push(metric(e,arrSet(e.best)));hist(e.id).forEach(h=>ser.push(Math.max(...h.sets.map(s=>metric(e,s)))));
  const b=bestSet(e),st=e.start?arrSet(e.start):null;let ch='';
  if(st&&b){if(e.kind==='assist'){const d=r1(st.w-b.w);ch=`<span class="${d>=0?'up':'down'}">${d>=0?'−':'+'}${Math.abs(d)} kg assist</span>`}
   else{const pct=Math.round((metric(e,b)/metric(e,st)-1)*100);ch=`<span class="${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct}%</span>`}}
  return`<div class="stat"><div style="flex:1"><div>${e.e} ${esc(e.name)}</div><div class="mut">${st?fs(e,st)+' → ':''}best ${fs(e,b)} · ${count(e)}×</div></div><div style="text-align:right">${ch}<br>${spark(ser)}</div></div>`}).join('');
 const tot=S.sessions.length,vol=S.sessions.reduce((a,s)=>a+volume(s),0);
 return header()+`<div class="card"><h2>In this app</h2><div class="mut">${tot} workouts · ${Math.round(vol/1000*10)/10} t lifted · ${S.sessions.reduce((a,s)=>a+(s.dur||0),0)} min</div></div>
 <div class="card"><h2>Weekly volume (kg)</h2>${weekChart()}</div>
 <div class="card"><h2>Exercises</h2><div class="mut">% = change in estimated 1RM since block start</div>${rows}</div>`}

function rHist(){if(!S.sessions.length)return'<div class="card mut">No sessions logged in the app yet.</div>';const base=+S.settings.prior||0;
 return S.sessions.map((s,i)=>({s,i})).reverse().map(({s,i})=>`<div class="card"><details><summary><div class="row"><div style="flex:1"><h2>#${base+i+1} · ${dfmt(s.date)}</h2><div class="mut">${s.items.length} exercises · ${Math.round(volume(s))} kg · ${s.dur??'?'} min</div></div><span class="mut">▾</span></div></summary>
 ${s.items.map(it=>{const e=X(it.ex)||{e:'',name:it.ex,kind:'lift'};return`<div class="ex"><div class="nm">${e.e} ${esc(e.name)}</div><div class="mut">${it.sets.map(x=>fs(e,x)).join(', ')}</div></div>`}).join('')}
 <button class="btn small sec" data-act="hdel" data-i="${i}">Delete session</button></details></div>`).join('')}

function rSet(){const st=S.settings,f=(k,l,t='number')=>`<div class="mut" style="margin-top:10px">${l}</div><input class="plain" style="margin-top:4px" type="${t}" ${t==='number'?'inputmode="numeric"':''} value="${esc(st[k])}" data-set="${k}">`;
 return`<div class="card"><h2>Block</h2>${f('startDate','Block start date','date')}${f('prior','Workouts done before this app')}${f('weeks','Goal (weeks)')}${f('perWeek','Workouts per week')}${f('per','Exercises per workout (excl. warm-up)')}${f('rest','Rest timer (seconds)')}</div>
 <div class="card"><h2>Exercises</h2><div class="mut">on = can be suggested · 📌 = every session</div>${S.ex.map(e=>`<div class="ex"><div class="nm">${e.e} ${esc(e.name)}</div><label class="mut"><input type="checkbox" data-exa="active" data-id="${e.id}" ${e.active?'checked':''}> on</label><label class="mut"><input type="checkbox" data-exa="pin" data-id="${e.id}" ${e.pin?'checked':''}> 📌</label></div>`).join('')}</div>
 <div class="card"><h2>Backup</h2><div class="mut">Data lives only in this browser. Export every few weeks.</div><button class="btn sec" data-act="exp">Export JSON</button><label class="btn sec" style="text-align:center">Import JSON<input id="imp" type="file" accept="application/json,.json" hidden></label><button class="btn sec" data-act="reset" style="color:var(--bad)">Reset everything</button></div>`}

// ---------- actions ----------
function start(){if(!S.plan||!S.plan.length)return toast('Add an exercise first');S.cur={started:Date.now(),items:S.plan.map(id=>({ex:id,sets:prefill(X(id))}))};S.plan=null;save();tab='work';render();scrollTo(0,0)}
function finish(){const c=S.cur;
 const items=c.items.map(it=>({ex:it.ex,sets:it.sets.filter(s=>s.done).map(s=>({w:+s.w,r:+s.r}))})).filter(it=>it.sets.length);
 if(!items.length){if(confirm('No ticked sets. Discard workout?')){S.cur=null;save();tab='plan';render()}return}
 const prs=[];items.forEach(it=>{const e=X(it.ex),prev=bestMetric(e),ms=it.sets.map(s=>metric(e,s)),m=Math.max(...ms);
  if(prev!=null&&m>prev+1e-9)prs.push(`${e.e} ${e.name}: ${fs(e,it.sets[ms.indexOf(m)])}`)});
 const sess={date:Date.now(),dur:Math.round((Date.now()-c.started)/60000),items};S.sessions.push(sess);S.cur=null;restEnd=0;save();
 const p=prog();tab='stats';render();scrollTo(0,0);
 modal(`<h1>Workout #${p.done} done 🎉</h1><div class="mut">${sess.dur} min · ${Math.round(volume(sess))} kg · ${items.reduce((a,b)=>a+b.sets.length,0)} sets</div>
 ${prs.length?`<h2 style="margin-top:14px">🏆 New bests</h2>${prs.map(x=>`<div>${esc(x)}</div>`).join('')}`:'<p>Logged. Showing up was the PR today.</p>'}
 <p class="mut">${Math.max(0,p.goal-p.done)} workouts left in the ${S.settings.weeks}-week block.</p><button class="btn" data-act="close">Nice</button>`)}
function startRest(sec){restDur=Math.max(1,sec*1000);restEnd=Date.now()+restDur;tick()}
function tick(){const el=document.getElementById('timer');if(!restEnd){el.style.display='none';return}
 const left=restEnd-Date.now();if(left<=0){restEnd=0;el.style.display='none';beep();if(navigator.vibrate)navigator.vibrate([250,120,250]);toast('⏱️ Rest over — next set');return}
 el.style.display='block';const s=Math.ceil(left/1000);document.getElementById('tt').textContent=Math.floor(s/60)+':'+p2(s%60);document.getElementById('tb').style.width=Math.min(100,left/restDur*100)+'%'}
function unlock(){try{if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
function beep(){try{if(!actx)return;[0,.25,.5].forEach(t=>{const o=actx.createOscillator(),g=actx.createGain(),n=actx.currentTime+t;o.frequency.value=880;g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(.3,n+.02);g.gain.exponentialRampToValueAtTime(.0001,n+.18);o.connect(g).connect(actx.destination);o.start(n);o.stop(n+.2)})}catch(e){}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function modal(h){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${h}</div>`;document.body.appendChild(m)}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='vtaper-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Backup exported')}
function importFile(f){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.ex||!d.sessions)throw 0;if(!confirm('Replace current data with this backup?'))return;S=d;save();tab='stats';render();toast('Imported')}catch(e){toast('Not a valid backup file')}};r.readAsText(f)}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-tab],[data-act]');if(!b||b.tagName==='SELECT')return;unlock();
 if(b.dataset.tab){tab=b.dataset.tab;render();scrollTo(0,0);return}
 const a=b.dataset.act,i=+b.dataset.i,j=+b.dataset.j,c=S.cur;
 switch(a){
  case'inc':{const s=c.items[i].sets[j],e=X(c.items[i].ex),f=b.dataset.f,st=f==='w'?(e.step||1):1;s[f]=Math.max(0,r1((+s[f]||0)+st*(+b.dataset.d)));b.parentNode.querySelector('input').value=s[f];save();return}
  case'done':{const s=c.items[i].sets[j];s.done=!s.done;save();render();if(s.done&&X(c.items[i].ex).kind!=='cardio')startRest(+S.settings.rest||90);return}
  case'addset':{const ss=c.items[i].sets,l=ss[ss.length-1]||{w:0,r:0};ss.push({w:l.w,r:l.r,done:false});break}
  case'rmset':{const ss=c.items[i].sets;if(ss.length>1&&!ss[ss.length-1].done)ss.pop();else{toast('Only removes an unticked last set');return}break}
  case'wrm':if(!confirm('Remove '+X(c.items[i].ex).name+'?'))return;c.items.splice(i,1);break;
  case'plrm':S.plan=S.plan.filter(x=>x!==b.dataset.id);break;
  case'regen':S.plan=buildPlan();break;
  case'start':start();return;
  case'finish':finish();return;
  case'cancel':if(!confirm('Discard this workout?'))return;S.cur=null;restEnd=0;tab='plan';break;
  case'rest':{const d=+b.dataset.d;if(!d)restEnd=0;else{restEnd+=d*1000;restDur=Math.max(1,restDur+d*1000)}tick();return}
  case'hdel':if(!confirm('Delete this session?'))return;S.sessions.splice(i,1);break;
  case'close':b.closest('.modal').remove();return;
  case'exp':exportData();return;
  case'reset':if(!(confirm('Erase ALL data?')&&confirm('Really? Export a backup first if unsure.')))return;S=defaults();break;
  default:return}
 save();render()});

document.addEventListener('change',ev=>{const t=ev.target,a=t.dataset.act;
 if(t.matches('.step input')){const s=S.cur.items[+t.dataset.i].sets[+t.dataset.j];s[t.dataset.f]=Math.max(0,parseFloat(String(t.value).replace(',','.'))||0);t.value=s[t.dataset.f];save();return}
 if(a==='pladd'&&t.value){S.plan=sortPlan([...S.plan,t.value]);save();render();return}
 if(a==='wadd'&&t.value){S.cur.items.push({ex:t.value,sets:prefill(X(t.value))});save();render();return}
 if(t.dataset.set){const k=t.dataset.set;S.settings[k]=t.type==='number'?(+t.value||0):t.value;if(k==='per')S.plan=null;save();render();return}
 if(t.dataset.exa){X(t.dataset.id)[t.dataset.exa]=t.checked;S.plan=null;save();render();return}
 if(t.id==='imp'&&t.files[0])importFile(t.files[0]);
});
document.addEventListener('focusin',e=>{if(e.target.matches('.step input'))setTimeout(()=>e.target.select(),0)});

try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
setInterval(tick,250);render();
</script>
<script>if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});</script>
</body></html>
